  <ellipse cx="130" cy="315" rx="42" ry="50" fill="url(#skin1)"/>

  <!-- 신랑 머리카락 (짧은 올백) -->
  <ellipse cx="130" cy="278" rx="42" ry="28" fill="#2C2420"/>
  <path d="M88,295 Q90,270 130,265 Q170,270 172,295" fill="#2C2420"/>
