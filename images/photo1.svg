  <path d="M112,303 Q120,298 128,302" stroke="#2C2420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M132,302 Q140,298 148,303" stroke="#2C2420" stroke-width="2.5" fill="none" stroke-linecap="round"/>

