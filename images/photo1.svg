<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5E8"/>
      <stop offset="100%" stop-color="#F0E0C8"/>
    </radialGradient>
    <radialGradient id="skin1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDDBB4"/>
      <stop offset="100%" stop-color="#F5C490"/>
    </radialGradient>
    <radialGradient id="skin2" cx="50%" cy="40%" r="60%">
