  <path d="M252,295 Q260,290 268,294" stroke="#3D2B1F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M272,294 Q280,290 288,295" stroke="#3D2B1F" stroke-width="1.8" fill="none" stroke-linecap="round"/>

