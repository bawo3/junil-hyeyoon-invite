<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 등록 · 준일 ♥ 혜윤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --gold-dark: #8B6F47;
  --cream: #FAF7F2;
  --text-dark: #2C2420;
  --text-mid: #5C4A3A;
  --text-light: #8B7355;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(232,213,176,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(183,110,121,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #FAF7F2 0%, #F0EAE0 100%);
  color: var(--text-dark);
  min-height: 100vh;
  padding: 40px 24px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%; max-width: 380px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 44px 28px;
  box-shadow: 0 20px 60px rgba(139,111,71,0.16), 0 1px 0 rgba(255,255,255,0.9) inset;
  text-align: center;
}

/* 체크 마크 애니메이션 */
.check {
  width: 70px; height: 70px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 34px;
  box-shadow: 0 8px 24px rgba(201,169,110,0.35);
  animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop {
  0%   { transform: scale(0);   opacity: 0; }
  60%  { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1);   opacity: 1; }
}

.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 5px;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 6px;
}
.title {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px; font-weight: 400;
  color: var(--text-dark); letter-spacing: 3px;
  margin-bottom: 8px;
}
.date {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 14px; color: var(--gold-dark);
  letter-spacing: 1px;
  margin-bottom: 24px;
}
.line {
  width: 28px; height: 1px;
  background: var(--gold-light);
  margin: 0 auto 24px;
}
.guide {
  font-size: 13px; color: var(--text-mid);
  line-height: 1.8; letter-spacing: 0.5px;
  margin-bottom: 22px;
}
.guide strong { color: var(--text-dark); font-weight: 500; }

/* Google 캘린더 등록 메인 버튼 */
.gcal-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 22px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #4285F4, #1A73E8);
  color: white;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 500;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(66,133,244,0.28);
  transition: all 0.25s;
}
.gcal-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(66,133,244,0.36); }
.gcal-btn:active { transform: translateY(0); }
.gcal-btn .gicon {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: white; color: #1A73E8;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px; font-weight: 700;
}

.alarm-note {
  margin-top: 16px;
  padding: 14px 16px;
  background: rgba(232,213,176,0.25);
  border: 1px solid rgba(201,169,110,0.25);
  border-radius: 12px;
  font-size: 12px; color: var(--text-mid);
  line-height: 1.75; letter-spacing: 0.3px;
  text-align: left;
}
.alarm-note strong { color: var(--gold-dark); font-weight: 500; }

.note {
  margin-top: 14px;
  padding: 14px 16px;
  background: rgba(250,247,242,0.7);
  border-radius: 12px;
  font-size: 11px; color: var(--text-light);
  line-height: 1.7; letter-spacing: 0.3px;
  text-align: left;
}
.note strong { color: var(--gold-dark); font-weight: 500; }

.home-link {
  display: block;
  margin-top: 22px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px; letter-spacing: 2px;
  color: var(--gold-dark);
  text-decoration: none;
  opacity: 0.75;
}
.home-link:hover { opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div class="check">✓</div>
  <div class="eyebrow">Save the Date</div>
  <div class="title">캘린더 등록</div>
  <div class="date">2026.12.27 (일) 오후 2:30</div>
  <div class="line"></div>

  <div class="guide">
    아래 버튼을 누르면 <strong>Google 캘린더</strong> 에<br>
    <strong>결혼식 7일 전 알림 일정</strong>이 자동 등록됩니다.
  </div>

  <button class="gcal-btn" onclick="addGoogle()">
    <span class="gicon">G</span>
    Google 캘린더에 등록하기
  </button>

  <div class="alarm-note">
    🔔 <strong>등록 일정 안내</strong><br>
    일정 날짜: <strong>2026.12.20 (일)</strong> · 결혼식 7일 전<br>
    캘린더 <strong>기본 알림이 자동으로</strong> 울리도록 설계되었습니다.
  </div>

  <div class="note">
    💡 <strong>iPhone 사용자</strong> — 기본 캘린더 앱에 Gmail 계정을 추가해두시면<br>
    Google 캘린더 일정이 자동 동기화됩니다.
  </div>

  <a class="home-link" href="/">← 청첩장으로 돌아가기</a>
</div>

<script>
/* 이벤트 정보
   ── Google 캘린더 URL 은 알림 시각을 파라미터로 받지 않아서,
   이벤트 자체를 결혼식 7일 전(2026-12-20) 으로 등록한다.
   사용자 계정의 기본 알림(보통 10분 전)이 D-7 에 자동으로 울리는 구조. */
const EVT = {
  title:    '준일/혜윤 결혼식 7일전',
  location: '부산 W웨딩 (국민연금 웨딩홀) 1층 컨벤션홀 · 부산광역시 연제구 중앙대로 1000',
  details:
    '🔔 7일전 알림이 되도록 설정되었습니다.\n\n' +
    '결혼일정: 2026년 12월 27일 14시 30분 ' +
    '부산 W웨딩 (국민연금 웨딩홀)- 1층 컨벤션홀 입니다.^^\n\n' +
    '세심하게 캘린더 알림까지 등록해주셔서 큰 도움이 됩니다. ' +
    '배려해주신 마음에 감사드립니다. 참석해주셔서 감사합니다.\n\n' +
    '청첩장: ' + location.origin + '/',
  /* 결혼식 7일 전 (2026-12-20) 14:30~16:30 KST → UTC 05:30~07:30 */
  startUTC: '20261220T053000Z',
  endUTC:   '20261220T073000Z',
};

/* photo.html에서 저장한 예식장 정보 / 예식 일자가 있으면 장소·상세문구·알림 시각을 모두 최신화
   (알림 시각은 항상 "예식일 7일 전, 예식과 같은 시각부터 2시간" 으로 재계산) */
(async function loadDynamicOverrides() {
  let venueName = '부산 W웨딩 (국민연금 웨딩홀)', venueHall = '1층 컨벤션홀', venueAddr = '부산광역시 연제구 중앙대로 1000';
  let year = 2026, month = 12, day = 27, hour = 14, minute = 30;

  try {
    const vRes = await fetch('/api/venue');
    if (vRes.ok) {
      const v = await vRes.json();
      if (v) {
        venueName = v.name || venueName;
        venueHall = v.hall || venueHall;
        venueAddr = v.address || venueAddr;
      }
    }
  } catch (e) { console.warn('예식장 정보 로드 실패:', e); }

  try {
    const dRes = await fetch('/api/date');
    if (dRes.ok) {
      const d = await dRes.json();
      if (d && d.year) {
        year = d.year; month = d.month; day = d.day;
        hour = d.hour ?? hour; minute = d.minute ?? minute;
      }
    }
  } catch (e) { console.warn('예식 일자 로드 실패:', e); }

  /* 장소 텍스트 */
  EVT.location = `${venueName} ${venueHall} · ${venueAddr}`.replace(/\s+/g, ' ').trim();

  /* 상세 문구의 날짜·시간·장소 갱신 */
  const pad2 = n => String(n).padStart(2, '0');
  const dateText = `${year}년 ${pad2(month)}월 ${pad2(day)}일`;
  const h12 = hour % 12 === 0 ? 12 : hour % 12;
  const period = hour < 12 ? '오전' : '오후';
  const timeDisplay = `${period} ${h12}시${minute > 0 ? ' ' + minute + '분' : ''}`;
  EVT.details =
    '🔔 7일전 알림이 되도록 설정되었습니다.\n\n' +
    `결혼일정: ${dateText} ${timeDisplay} ` +
    `${venueName}- ${venueHall} 입니다.^^\n\n` +
    '세심하게 캘린더 알림까지 등록해주셔서 큰 도움이 됩니다. ' +
    '배려해주신 마음에 감사드립니다. 참석해주셔서 감사합니다.\n\n' +
    '청첩장: ' + location.origin + '/';

  /* 알림 이벤트 시각 = 예식일 7일 전, 예식과 같은 KST 시각부터 2시간 블록 (UTC 변환: KST-9시간) */
  const toBasicUTC = (y, mo, d, h, mi) => {
    const dt = new Date(Date.UTC(y, mo - 1, d, h - 9, mi) - 7 * 24 * 60 * 60 * 1000);
    return `${dt.getUTCFullYear()}${pad2(dt.getUTCMonth() + 1)}${pad2(dt.getUTCDate())}T${pad2(dt.getUTCHours())}${pad2(dt.getUTCMinutes())}${pad2(dt.getUTCSeconds())}Z`;
  };
  EVT.startUTC = toBasicUTC(year, month, day, hour, minute);
  EVT.endUTC   = toBasicUTC(year, month, day, hour + 2, minute);
})();

/* ── 브라우저 환경 감지 ──
   카카오톡 내장 브라우저는 별도 WebView 라서 Chrome/Safari 의
   Google 로그인 세션과 분리되어 있다.
   → Android: Chrome 인텐트로 강제 전환
   → iOS:     googlechromes:// 스킴으로 Chrome 시도, 미설치 시 안내 */
function isKakaoBrowser() {
  return /KAKAOTALK/i.test(navigator.userAgent);
}
function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}
function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

/* ── Google 캘린더 일정 추가 ── */
function addGoogle() {
  const params = new URLSearchParams({
    action:  'TEMPLATE',
    text:    EVT.title,
    dates:   `${EVT.startUTC}/${EVT.endUTC}`,
    details: EVT.details,
    location: EVT.location,
    ctz:     'Asia/Seoul'
  });
  const query   = params.toString();
  const httpsUrl = `https://calendar.google.com/calendar/render?${query}`;

  /* ① 카카오톡 내장 브라우저 + Android — Chrome 인텐트로 강제 */
  if (isKakaoBrowser() && isAndroid()) {
    /* intent:// 스킴: Chrome 으로 같은 URL 열기 */
    location.href =
      `intent://calendar.google.com/calendar/render?${query}` +
      `#Intent;scheme=https;package=com.android.chrome;end`;
    return;
  }

  /* ② 카카오톡 내장 브라우저 + iOS — Chrome → Safari → 수동 안내 순으로 시도
     iOS 는 공식 Safari URL 스킴이 없지만 비공식 `x-safari-https://` 가
     카카오 WebView 에서 동작하는 경우가 많아 2차 시도로 사용한다. */
  if (isKakaoBrowser() && isIOS()) {
    const chromeUrl = `googlechromes://calendar.google.com/calendar/render?${query}`;
    const safariUrl = `x-safari-https://calendar.google.com/calendar/render?${query}`;

    /* 페이지가 hidden/pagehide 상태로 바뀌면 외부 브라우저 전환 성공으로 간주 */
    let didLeave = false;
    const onHide = () => { didLeave = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    window.addEventListener('pagehide', onHide, { once: true });

    /* 1단계 — Chrome 시도 */
    location.href = chromeUrl;

    /* 2단계 — 0.8초 내 Chrome 전환 실패 시 Safari 시도 */
    setTimeout(() => {
      if (didLeave) return;
      location.href = safariUrl;

      /* 3단계 — 다시 0.8초 내 Safari 전환도 실패 시 수동 안내 */
      setTimeout(() => {
        if (didLeave) return;
        alert(
          '외부 브라우저로 자동 전환에 실패했습니다.\n\n' +
          '카카오톡 우측 상단 ⋮ 메뉴 →\n' +
          '"다른 브라우저로 열기" 를 선택해주세요.'
        );
      }, 800);
    }, 800);
    return;
  }

  /* ③ 일반 브라우저 — 새 탭으로 정상 열기 */
  window.open(httpsUrl, '_blank', 'noopener');
}
</script>
</body>
</html>
