  <ellipse cx="292" cy="315" rx="12" ry="7" fill="#F4A0A0" opacity="0.3"/>

  <!-- 신부 입술 (립스틱) -->
  <path d="M262,325 Q270,322 278,325 Q270,332 262,325Z" fill="#D45870"/>
  <path d="M262,325 Q270,328 278,325" fill="none" stroke="#C04060" stroke-width="1"/>

  <!-- 신부 귀 -->
  <ellipse cx="230" cy="308" rx="6" ry="9" fill="url(#skin2)"/>
  <ellipse cx="310" cy="308" rx="6" ry="9" fill="url(#skin2)"/>
  <!-- 귀걸이 -->
  <circle cx="230" cy="320" r="4" fill="#C9A96E"/>
  <circle cx="310" cy="320" r="4" fill="#C9A96E"/>

  <!-- 신부 베일 -->
  <path d="M228,272 Q200,300 205,380 Q210,370 215,340 Q218,310 225,285" fill="white" opacity="0.5"/>
  <path d="M228,272 Q225,275 224,285" stroke="#C9A96E" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- ── 가운데 하트 ── -->
  <g transform="translate(200, 420)">
    <path d="M0,-12 C-4,-20 -16,-20 -16,-8 C-16,0 0,12 0,12 C0,12 16,0 16,-8 C16,-20 4,-20 0,-12Z"
          fill="#C9A96E" opacity="0.8"/>
  </g>

  <!-- ── 장식 꽃 (상단) ── -->
  <g transform="translate(200, 50)" opacity="0.7">
    <circle cx="0" cy="0" r="6" fill="#C9A96E"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#E8C8A0" transform="rotate(0)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#E8C8A0" transform="rotate(45)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#E8C8A0" transform="rotate(90)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#E8C8A0" transform="rotate(135)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#F0D8B0" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#F0D8B0" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#F0D8B0" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="8" fill="#F0D8B0" transform="rotate(157.5)"/>
    <circle cx="0" cy="0" r="5" fill="#C9A96E"/>
  </g>

  <!-- ── 하단 텍스트 ── -->
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        fill="#8B6F47" letter-spacing="3" opacity="0.8">Our First Date</text>
</svg>
